name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::error::Missing app/google-services.json. Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret -> Name: GOOGLE_SERVICES_JSON"
              exit 1
            fi
          fi
          python3 -c 'import json; d=json.load(open("app/google-services.json")); print("Configured package:", d["client"][0]["client_info"]["android_client_info"]["package_name"])'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          grep -qxF "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          grep -qxF "84831b9409646a918e30573bab4c9c91346d8abd" "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MANAGER" ]; then
            set +o pipefail
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Restore or create debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from repo debug.keystore.base64"
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
          else
            echo "::warning::debug.keystore.base64 not found! Google Sign-In will fail unless this SHA-1 is added to Firebase."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietCare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
